name: rpg66-login-daily-task
    
on:
  push:
    branches: [ main ]
  schedule:
    # 每天早上6:10定时执行
    - cron: '0 22 * * *'
  watch:
    types: started

  workflow_dispatch:
       
jobs:
  Rpg66Login:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Cache local Maven repository
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        env:
          COOKIE: ${{ secrets.COOKIE }}
          REQUESTS_INFO: ${{ secrets.REQUESTS_INFO }}
          APPTOKEN: ${{ secrets.APPTOKEN }}
          UID: ${{ secrets.UID }}
        run: |
          mvn compile exec:java -Dexec.mainClass="io.ybqdren.github.Main" -Dexec.args="${COOKIE} ${REQUESTS_INFO} ${APPTOKEN} ${UID}"
