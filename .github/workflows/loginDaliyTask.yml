name: rpg66-login-daily-task
on:
  push:
    branches: [ master ]
  schedule:
    # 定时任务，在每天的5点执行任务
    - cron: '0 21 * * *'
jobs:
  Rpg66Login:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 1.8
        uses: actions/setup-java@v1
        with:
          java-version: 1.8
      - name: Cache local Maven repository
        uses: actions/cache@v2
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-
      - name: Build with Maven
        env:
          COOKIE: ${{ secrets.COOKIE }}
          SCKEY: ${{ secrets.SCKEY }}
        run: |
          mvn compile exec:java -Dexec.mainClass="io.ybqdren.github.Main" -Dexec.args="${COOKIE} ${SCKEY}"